[package]
name = "lewm-drone-viewer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bevy replay viewer for le-wm-nv drone world-model reports."

[dependencies]
anyhow = "1.0.102"
bevy = { version = "=0.18.1", default-features = false, features = ["3d", "ui"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
