[package]
name = "lewm-drone-viewer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bevy replay viewer for le-wm-nv drone world-model reports."
autobins = false

[[bin]]
name = "lewm-drone-viewer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
bevy = { git = "https://github.com/bevyengine/bevy", branch = "release-0.19.0", default-features = false, features = ["3d", "ui"] }
bevy_camera_controller = { git = "https://github.com/bevyengine/bevy", branch = "release-0.19.0", default-features = false, features = ["free_camera"] }
candle = { package = "candle-core", version = "0.10.2", features = ["cuda", "cudnn"] }
le-wm-nv = { path = "../.." }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
