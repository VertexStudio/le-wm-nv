[package]
name = "le-wm-nv"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "NVIDIA/CUDA-first LeWM training and inference runtime."
autobins = false

[workspace]
members = ["crates/drone-viewer"]
resolver = "3"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ndarray = "0.17.2"
csv = "1.4.0"
walkdir = "2.5.0"
rayon = "1.12.0"
sha2 = "0.10.9"

candle = { package = "candle-core", version = "0.10.2", features = ["cuda", "cudnn"] }
candle-nn = { package = "candle-nn", version = "0.10.2", features = ["cuda", "cudnn"] }
candle-transformers = { version = "0.10.2", features = ["cuda", "cudnn"] }

hdf5 = { package = "hdf5-metno", version = "0.12.4", features = ["blosc-all", "static", "zlib"] }
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq"], optional = true }
nvjpeg-sys = "0.1.0"

[features]
hub = ["dep:hf-hub"]

[lib]
name = "le_wm_nv"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "lewm-inspect"
path = "src/bin/lewm-inspect.rs"

[[bin]]
name = "lewm-compare-fixture"
path = "src/bin/lewm-compare-fixture.rs"

[[bin]]
name = "lewm-plan-fixture"
path = "src/bin/lewm-plan-fixture.rs"

[[bin]]
name = "lewm-plan-images"
path = "src/bin/lewm-plan-images.rs"

[[bin]]
name = "lewm-train-batch"
path = "src/bin/lewm-train-batch.rs"

[[bin]]
name = "lewm-train-pusht"
path = "src/bin/lewm-train-pusht.rs"

[[bin]]
name = "lewm-drone-import"
path = "src/bin/lewm-drone-import.rs"

[[bin]]
name = "lewm-train-drone"
path = "src/bin/lewm-train-drone.rs"

[[bin]]
name = "lewm-train-skyjepa"
path = "src/bin/lewm-train-skyjepa.rs"

[[bin]]
name = "lewm-eval-skyjepa"
path = "src/bin/lewm-eval-skyjepa.rs"

[[bin]]
name = "lewm-generate-skyjepa"
path = "src/bin/lewm-generate-skyjepa.rs"

[[bin]]
name = "lewm-audit-skyjepa"
path = "src/bin/lewm-audit-skyjepa.rs"

[[bin]]
name = "lewm-sim-skyjepa"
path = "src/bin/lewm-sim-skyjepa.rs"

[[bin]]
name = "lewm-drone-dynamics-stats"
path = "src/bin/lewm-drone-dynamics-stats.rs"

[[bin]]
name = "lewm-drone-fit-plant"
path = "src/bin/lewm-drone-fit-plant.rs"

[[bin]]
name = "lewm-drone-rollout-eval"
path = "src/bin/lewm-drone-rollout-eval.rs"

[[bin]]
name = "lewm-drone-oracle-eval"
path = "src/bin/lewm-drone-oracle-eval.rs"

[[bin]]
name = "lewm-drone-planner-eval"
path = "src/bin/lewm-drone-planner-eval.rs"
